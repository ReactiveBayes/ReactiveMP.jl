name = "StandardMessagePassingRules"
uuid = "d166223a-7879-43b1-add3-64af0a178e9e"
version = "0.1.0-DEV"

# Distribution nodes, arithmetic (+, -, *, dot), logic (AND, OR, NOT, IMPLY) and the
# mixtures. Domain-specific models (GCV, Probit, SoftDot, GaussianCoupling) belong to a
# sibling package whose name is deferred to Phase 6; INVENTORY.md records them as `models`.
#
# Tests run from test/Project.toml, not from [extras]: MessagePassingRulesTestUtils is
# unregistered, and on the 1.10 floor, where [sources] is ignored, developing it into this
# project would make it a runtime dependency. See lib/README.md.

[deps]
BayesBase = "b4ee3484-f114-42fe-b91c-797d54a0c67e"
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
ExponentialFamily = "62312e5e-252a-4322-ace9-a5f4bf9b357b"
LogExpFunctions = "2ab3a3ac-af41-5b50-aa03-7779005ae688"
MessagePassingRulesBase = "4a5b64c7-30c9-4471-82f2-bbe8464b157d"
SpecialFunctions = "276daf66-3868-5448-9aa4-cd146d93841b"
StatsFuns = "4c63d2b9-4356-54db-8cca-17b64c39e42c"

[sources]
MessagePassingRulesBase = {path = "../MessagePassingRulesBase"}

[compat]
BayesBase = "1.5"
Distributions = "0.25"
ExponentialFamily = "2.5"
LogExpFunctions = "0.3"
MessagePassingRulesBase = "0.1"
SpecialFunctions = "2.3"
StatsFuns = "1"
julia = "1.10"
