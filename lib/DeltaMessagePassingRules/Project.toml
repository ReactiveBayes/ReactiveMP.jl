name = "DeltaMessagePassingRules"
uuid = "ea5de7a7-24c9-4a61-90ce-ef77c844b13f"
version = "0.1.0-DEV"

# The Delta node, z = f(x₁, …, xₙ) for a deterministic function f: its declaration, its own
# algorithm (the approximation method and an optional known inverse, v6's DeltaMeta) and its
# rules. The engine owns the node object, the function and its static inputs, and reaches the
# function for a rule through `getnodefn`. INVENTORY.md records this package as `node:Delta`.

[deps]
BayesBase = "b4ee3484-f114-42fe-b91c-797d54a0c67e"
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
ExponentialFamily = "62312e5e-252a-4322-ace9-a5f4bf9b357b"
MessagePassingRulesApproximations = "36043009-14b3-4068-9fb9-f1e492c92d7d"
MessagePassingRulesBase = "4a5b64c7-30c9-4471-82f2-bbe8464b157d"

[weakdeps]
ExponentialFamilyProjection = "17f509fa-9a96-44ba-99b2-1c5f01f0931b"

[extensions]
DeltaMessagePassingRulesProjectionExt = "ExponentialFamilyProjection"

[sources]
MessagePassingRulesApproximations = {path = "../MessagePassingRulesApproximations"}
MessagePassingRulesBase = {path = "../MessagePassingRulesBase"}
MessagePassingRulesTestUtils = {path = "../MessagePassingRulesTestUtils"}

[compat]
