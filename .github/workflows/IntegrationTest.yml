name: Test dependent packages

# Based on https://github.com/SciML/SciMLBase.jl/blob/master/.github/workflows/Downstream.yml

on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:

concurrency:
  # Cancel superseded runs for the same ref: new pushes to `main` cancel the
  # previous `main` run, and new commits on a PR cancel that PR's earlier run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
    test:
        name: ${{ matrix.package.repo }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                # The latest Julia only: the root suite covers every supported version.
                julia-version: ['1']
                os: [ubuntu-latest]
                package:
                    # Add downstream packages that depend on ReactiveMP here
                    # Each entry runs as a separate parallel job
                    - { user: ReactiveBayes, repo: RxInfer.jl, ref: main }


        steps:
            - uses: actions/checkout@v6

            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.julia-version }}
                  arch: x64

            - uses: julia-actions/julia-buildpkg@v1

            - name: Clone Downstream
              uses: actions/checkout@v6
              with:
                  repository: ${{ matrix.package.user }}/${{ matrix.package.repo }}
                  ref: ${{ matrix.package.ref }}
                  path: downstream

            - name: Load this and run the downstream tests
              shell: julia --project=downstream {0}
              run: |
                  using Pkg
                  # The downstream runs on this checkout of ReactiveMP. A resolver error means
                  # the downstream's compat excludes this version: it fails the job, as any test does.
                  Pkg.develop(PackageSpec(path = "."))
                  Pkg.test()
