name: Test dependent packages

# Based on https://github.com/SciML/SciMLBase.jl/blob/master/.github/workflows/Downstream.yml

on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:

concurrency:
  # Cancel superseded runs for the same ref: new pushes to `main` cancel the
  # previous `main` run, and new commits on a PR cancel that PR's earlier run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
    test:
        name: ${{ matrix.package.repo }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                # Julia 1.13 while the rewrite targets it: the downstream branch wires this
                # repository with [sources].
                julia-version: ['1.13']
                os: [ubuntu-latest]
                package:
                    # Add downstream packages that depend on ReactiveMP here
                    # Each entry runs as a separate parallel job
                    # RxInfer's branch adapted to ReactiveMP v7 (Phase 7), until its release.
                    - { user: ReactiveBayes, repo: RxInfer.jl, ref: refactor/reactivemp-v7 }


        steps:
            - uses: actions/checkout@v6

            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.julia-version }}
                  arch: x64

            - uses: julia-actions/julia-buildpkg@v1

            - name: Clone Downstream
              uses: actions/checkout@v6
              with:
                  repository: ${{ matrix.package.user }}/${{ matrix.package.repo }}
                  ref: ${{ matrix.package.ref }}
                  path: downstream

            # The branch reaches ReactiveMP and its rule packages through [sources] at the
            # sibling path `../ReactiveMP.jl`; here this repository is the downstream's parent.
            - name: Point the downstream's [sources] at this checkout
              run: sed -i 's#\.\./ReactiveMP\.jl#..#g' downstream/Project.toml

            - name: Load this and run the downstream tests
              shell: julia --project=downstream {0}
              run: |
                  using Pkg
                  try
                      # The downstream's [sources] already use this checkout of ReactiveMP
                      # and its rule packages.
                      Pkg.instantiate()
                      Pkg.test()  # run downstream tests
                  catch err
                      err isa Pkg.Resolve.ResolverError || rethrow()
                      # If resolver fails, assume intentional breaking change (SemVer)
                      @info "Not compatible with this release. No problem." exception=err
                      exit(0)  # Treat as success
                  end
