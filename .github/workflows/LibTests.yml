name: Lib

on:
  workflow_dispatch:
  pull_request:
    types: [review_requested, reopened, synchronize]
    paths:
      - 'lib/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/LibTests.yml'
  push:
    branches:
      - 'main'
      - 'refactor/rule-node-system-rewrite'
    paths:
      - 'lib/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/LibTests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Julia 1.13, whose [sources] wire the siblings, so each package is tested from its own project, as `make test-<package>` does.
jobs:
  test:
    name: ${{ matrix.package }} - Julia 1.13
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The Makefile's targets, one per package under lib/.
        package:
          - base
          - testutils
          - standard
          - approximations
          - delta
          - gaussian-coupling
          - probit
          - gcv
          - autoregressive
          - softdot
          - continuous-transition
          - polya
          - bifm
          - flow
          - discrete-transition
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - name: Test
        env:
          # The fast local default skips `:slow` items; CI runs everything, and so the
          # rule-coverage gates run too.
          TEST_ALL: true
          JULIA_FASTCHOLESKY_THROW_ERROR_NON_SYMMETRIC: 1
        run: make test-${{ matrix.package }}
