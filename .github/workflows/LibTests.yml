name: Lib

on:
  workflow_dispatch:
  pull_request:
    types: [review_requested, reopened, synchronize]
    paths:
      - 'lib/**'
      - 'compat/**'
      - '.github/workflows/LibTests.yml'
  push:
    branches:
      - 'main'
      - 'refactor/rule-node-system-rewrite'
    paths:
      - 'lib/**'
      - 'compat/**'
      - '.github/workflows/LibTests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
          - '1.12'
        package:
          - MessagePassingRulesBase
          - MessagePassingRulesTestUtils
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Test
        env:
          TEST_ALL: true
        run: |
          julia --startup-file=no --project=lib/${{ matrix.package }} -e '
            using Pkg
            "${{ matrix.package }}" == "MessagePassingRulesBase" || Pkg.develop(path = "lib/MessagePassingRulesBase")
            Pkg.test()'

  standard:
    # Tested from its test/Project.toml: the test tooling is unregistered, and on 1.10, where
    # [sources] is ignored, developing it into the package itself would make it a runtime
    # dependency. So the siblings are developed into the test environment instead.
    name: StandardMessagePassingRules - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.11'
          - '1.12'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Test
        env:
          TEST_ALL: true
        run: |
          julia --startup-file=no --project=lib/StandardMessagePassingRules/test -e '
            import Pkg
            Pkg.develop([Pkg.PackageSpec(path = p) for p in ("lib/MessagePassingRulesBase", "lib/MessagePassingRulesTestUtils", "lib/StandardMessagePassingRules")])
            Pkg.instantiate()'
          julia --startup-file=no --project=lib/StandardMessagePassingRules/test lib/StandardMessagePassingRules/test/runtests.jl

  v6-comparison:
    name: v6 comparison - Julia 1.10
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Compare ports with v6 and verify v6 rules
        run: |
          julia --startup-file=no --project=compat/v6-comparison -e 'using Pkg; Pkg.instantiate()'
          julia --startup-file=no --project=compat/v6-comparison compat/v6-comparison/check.jl
      - name: Compare the StandardMessagePassingRules ports with v6
        run: julia --startup-file=no --project=compat/v6-comparison compat/v6-comparison/compare_standard.jl
      - name: Re-record the v6 engine fixtures and compare with the committed ones
        run: julia --startup-file=no --project=compat/v6-comparison compat/v6-comparison/record_engine_fixtures.jl --check
