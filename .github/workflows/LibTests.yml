name: Lib

on:
  workflow_dispatch:
  pull_request:
    types: [review_requested, reopened, synchronize]
    paths:
      - 'lib/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/LibTests.yml'
  push:
    branches:
      - 'main'
      - 'refactor/rule-node-system-rewrite'
    paths:
      - 'lib/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/LibTests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GCVMessagePassingRules, the one package left under lib/ until it is registered, is tested from
# its own project, as `make test-gcv` does, on every supported Julia, 1.10 and later. Its siblings
# are registered and come from General.
jobs:
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1.11', '1.12', '1.13']
        # The Makefile's targets, one per package under lib/.
        package:
          - gcv
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Test
        env:
          # The fast local default skips `:slow` items; CI runs everything, and so the
          # rule-coverage gates run too.
          TEST_ALL: true
          JULIA_FASTCHOLESKY_THROW_ERROR_NON_SYMMETRIC: 1
        run: make test-${{ matrix.package }}
