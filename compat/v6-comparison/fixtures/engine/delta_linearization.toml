[header]
format = 1
julia = "1.13.0"
notes = """Recorded from ReactiveMP 6.5.0 through RxInfer 5.5.2, unmodified.\nLog scales are recorded only for bp_iid and mixture_bp. v6 cannot annotate the others: NormalMeanVariance(:μ)\nwith (m_out::Normal, q_v::PointMass) sets no @logscale (mean.jl:30) while its mirror out.jl:40\ndoes. Found by reading, and not triggered by these models: LogScaleAnnotations' all-point-mass\nfallback (logscale.jl:45-49) covers all-messages or all-marginals, never a mix of the two."""

    [header.packages]
    ReactiveMP = "6.5.0"
    RxInfer = "5.5.2"

[trajectory]
description = "x ~ NMV(0.5, 1), z := x^3 - x (Linearization), y ~ NMV(z, 0.1) observed at 2.0."
free_energy = [17.36616912536773, 17.36616912536773, 17.36616912536773]
id = "delta_linearization"

    [trajectory.posteriors.x]
    params = [-5.124999999999999, 1.625]
    type = "NormalWeightedMeanPrecision"

    [trajectory.posteriors.z]
    params = [14.0, 26.0]
    type = "NormalWeightedMeanPrecision"

    [[trajectory.trace]]
    iteration = 0
    node = "NormalMeanVariance"
    target = ":out"

        [trajectory.trace.result]
        params = [0.5, 1.0]
        type = "NormalMeanVariance"
    [[trajectory.trace]]
    iteration = 0
    node = "NormalMeanVariance"
    target = ":out"

        [trajectory.trace.result]
        params = [0.5, 1.0]
        type = "NormalMeanVariance"
    [[trajectory.trace]]
    iteration = 1
    node = "DeltaFn"
    target = ":out"

        [trajectory.trace.result]
        params = [-0.375, 0.0625]
        type = "NormalMeanVariance"
    [[trajectory.trace]]
    iteration = 1
    node = "NormalMeanVariance"
    target = ":μ"

        [trajectory.trace.result]
        params = [2.0, 0.1]
        type = "NormalMeanVariance"
    [[trajectory.trace]]
    iteration = 1
    node = "DeltaFn"
    target = "(:in, 1)"

        [trajectory.trace.result]
        params = [-5.624999999999999, 0.625]
        type = "NormalWeightedMeanPrecision"
    [[trajectory.trace]]
    iteration = 2
    node = "NormalMeanVariance"
    target = ":μ"

        [trajectory.trace.result]
        params = [2.0, 0.1]
        type = "NormalMeanVariance"
    [[trajectory.trace]]
    iteration = 2
    node = "DeltaFn"
    target = "(:in, 1)"

        [trajectory.trace.result]
