[header]
format = 1
julia = "1.13.0"
notes = """Recorded from ReactiveMP 6.5.0 through RxInfer 5.5.2, unmodified.\nLog scales are recorded only for bp_iid and mixture_bp. v6 cannot annotate the others: NormalMeanVariance(:μ)\nwith (m_out::Normal, q_v::PointMass) sets no @logscale (mean.jl:30) while its mirror out.jl:40\ndoes. Found by reading, and not triggered by these models: LogScaleAnnotations' all-point-mass\nfallback (logscale.jl:45-49) covers all-messages or all-marginals, never a mix of the two."""

    [header.packages]
    ReactiveMP = "6.5.0"
    RxInfer = "5.5.2"

[trajectory]
description = "p ~ Beta(2, 3), r ~ Uniform(0, 1), y[i] ~ Bernoulli(p) observed at [1, 0, 1], u[i] ~ Bernoulli(r) observed at [0, 0, 1]; BP."
free_energy = [4.941642422609305, 4.941642422609305]
id = "bernoulli_priors"

    [trajectory.posteriors.p]
    params = [4.0, 4.0]
    type = "Beta"

    [trajectory.posteriors.r]
    params = [2.0, 3.0]
    type = "Beta"

    [[trajectory.trace]]
    iteration = 1
    node = "Beta"
    target = ":out"

        [trajectory.trace.result]
        params = [2.0, 3.0]
        type = "Beta"
    [[trajectory.trace]]
    iteration = 1
    logscale = -0.6931471805599453
