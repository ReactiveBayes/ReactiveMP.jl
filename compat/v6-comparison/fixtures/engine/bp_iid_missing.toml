[header]
format = 1
julia = "1.10.12"
notes = """Recorded from ReactiveMP 6.5.0 through RxInfer 5.5.2, unmodified.\nLog scales are recorded only for bp_iid. v6 cannot annotate the others: NormalMeanVariance(:μ)\nwith (m_out::Normal, q_v::PointMass) sets no @logscale (mean.jl:30) while its mirror out.jl:40\ndoes. Found by reading, and not triggered by these models: LogScaleAnnotations' all-point-mass\nfallback (logscale.jl:45-49) covers all-messages or all-marginals, never a mix of the two."""

    [header.packages]
    ReactiveMP = "6.5.0"
    RxInfer = "5.5.2"

[trajectory]
description = "bp_iid with the second observation missing: its rule call is skipped and yields `missing`. No annotations: predicting the missing y[2] calls NormalMeanVariance(:out) with (q_μ::Normal, q_v::PointMass), which sets no log scale in v6. RxInfer treats a missing observation as a prediction, which it will not combine with free energy, so none is recorded."
free_energy = []
id = "bp_iid_missing"

